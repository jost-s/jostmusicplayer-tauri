name: Build

# Cross-platform packaging job, used two ways:
#   * standalone (manual dispatch / PRs) as a smoke test — uploads the installers
#     as workflow artifacts and publishes nothing;
#   * called by release.yml as a reusable workflow — when given `tag_name` it
#     attaches the bundles to the release release-please published for that tag.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Rebuild: attach the bundles to the release for this tag."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      tag_name:
        description: "If set, attach the bundles to the existing release for this tag."
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/.cargo/**"
      - "src-tauri/rust-toolchain.toml"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    # Lets the attach step write to a release when called with a tag_name; unused
    # but harmless on the artifact-only dry-run path.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            label: Linux
            args: ""
          - os: windows-latest
            label: Windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        # rustup auto-installs the channel, components, and targets (including the
        # two macOS triples) pinned in src-tauri/rust-toolchain.toml.
        working-directory: src-tauri
        run: rustup show

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            cmake \
            build-essential \
            file \
            patchelf

      - name: Install dependencies
        run: npm ci

      # Build only. Attaching is a separate step so tauri-action never touches the
      # release: its tagName path rewrites name/body, which would blank the
      # changelog notes release-please wrote.
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Release path: attach this leg's installers. `gh release upload --clobber`
      # only replaces same-named assets, so the release notes stay put. The macOS
      # .app is a directory and is skipped; the .dmg is the deliverable.
      - name: Attach bundles to the release
        if: ${{ inputs.tag_name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundles found to attach to ${{ inputs.tag_name }}" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag_name }}" "${files[@]}" --clobber

      # Dry-run only (no tag_name): keep the bundles as inspectable artifacts.
      - name: Upload bundles
        if: ${{ !inputs.tag_name }}
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.label }}
          # Only the finished installers — NOT the uncompressed staging trees the
          # bundlers leave behind (e.g. appimage/*.AppDir, deb/<pkg>/), which are
          # full second copies of the bundled runtime and balloon the upload.
          # Covers both layouts: target/release/bundle (Linux, Windows — no
          # --target) and target/<triple>/release/bundle (macOS legs). Patterns
          # that match nothing on a given OS are simply ignored.
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
