name: Release Please

# Run by hand to open the release PR with the version bumps and changelog.
# Merging it triggers release.yml.
on:
  push:
    # branches:
      # - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PAT }}
          release-type: simple