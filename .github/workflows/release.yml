name: Release

# Runs on every push to main. release-please keeps the release PR current; when a
# merge cuts a release it bumps the versions, writes CHANGELOG.md, creates the
# vX.Y.Z tag and publishes the GitHub release. This same run then builds the
# installers and attaches them to that release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token rather than GITHUB_TOKEN or a PAT: GITHUB_TOKEN-created
      # events don't trigger workflows (so test.yml wouldn't run on the release PR),
      # and a PAT would author the PR as its owner, who can't approve it.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  build-tauri:
    name: Build bundles
    needs: release-please
    # Only when this run actually cut a release. Rebuilds go through build.yml.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
